    <script>
        (function() {
            var lightbox = document.getElementById('gallery-lightbox');
            var img = lightbox && lightbox.querySelector('.gallery-lightbox-img');
            var closeBtn = lightbox && lightbox.querySelector('.gallery-lightbox-close');
            var prevBtn = lightbox && lightbox.querySelector('.gallery-lightbox-nav--prev');
            var nextBtn = lightbox && lightbox.querySelector('.gallery-lightbox-nav--next');
            var links = Array.prototype.slice.call(document.querySelectorAll('[data-lightbox]'));
            var activeIndex = -1;
            if (!lightbox || !img) return;
            if (lightbox.parentNode !== document.body) {
                document.body.appendChild(lightbox);
            }

            function openLightboxAt(index) {
                if (!links.length) return;
                activeIndex = (index + links.length) % links.length;
                var activeLink = links[activeIndex];
                var src = activeLink.getAttribute('href');
                img.classList.add('gallery-lightbox-img--loading');
                img.src = src;
                img.onload = function() { img.classList.remove('gallery-lightbox-img--loading'); };
                lightbox.setAttribute('aria-hidden', 'false');
                lightbox.classList.add('gallery-lightbox--open');
                document.body.style.overflow = 'hidden';
                if (closeBtn) closeBtn.focus();
            }

            function closeLightbox() {
                lightbox.setAttribute('aria-hidden', 'true');
                lightbox.classList.remove('gallery-lightbox--open');
                document.body.style.overflow = '';
                activeIndex = -1;
            }

            function showPreviousPhoto() {
                if (!lightbox.classList.contains('gallery-lightbox--open')) return;
                openLightboxAt(activeIndex - 1);
            }

            function showNextPhoto() {
                if (!lightbox.classList.contains('gallery-lightbox--open')) return;
                openLightboxAt(activeIndex + 1);
            }

            links.forEach(function(link, index) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    openLightboxAt(index);
                });
            });

            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            if (prevBtn) prevBtn.addEventListener('click', showPreviousPhoto);
            if (nextBtn) nextBtn.addEventListener('click', showNextPhoto);
            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', function(e) {
                if (!lightbox.classList.contains('gallery-lightbox--open')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') showPreviousPhoto();
                if (e.key === 'ArrowRight') showNextPhoto();
            });
        })();
    </script>
